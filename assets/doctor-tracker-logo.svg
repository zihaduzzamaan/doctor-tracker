<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d9488" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#logo-grad)" filter="url(#logo-glow)"/>
  <!-- Stethoscope / Cross Icon -->
  <path d="M 50 24 L 50 76 M 24 50 L 76 50" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="16" fill="url(#logo-grad)" stroke="#ffffff" stroke-width="4"/>
  <path d="M 43 50 L 48 55 L 58 44" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
